name: TIGER Files Android CI and Latest Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiger-files-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Kotlin source before signing
        run: gradle :app:compileReleaseKotlin
      - name: Restore and verify stable signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          EXPECTED_SHA1="85EFC050123C89D9DA54763C70E6359DE107EAB2"
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Add the repository Actions secret ANDROID_DEBUG_KEYSTORE_BASE64 using the same stable keystore as HTML Editor and Scanner."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          ACTUAL_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | awk -F': ' '/SHA1:/ { gsub(":", "", $2); print toupper($2); exit }')"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing key mismatch. Use the same stable debug keystore as HTML Editor and Scanner."
            echo "Expected certificate SHA-1: $EXPECTED_SHA1"
            echo "Found certificate SHA-1: $( [ -n "$ACTUAL_SHA1" ] && echo "$ACTUAL_SHA1" || echo missing )"
            exit 1
          fi
          echo "Stable signing certificate verified: $ACTUAL_SHA1"
      - name: Build optimized release APK
        run: gradle :app:assembleRelease
      - name: Verify APK package, version, minimum Android and signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -s "$APK"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/tiger-badging.txt
          grep -F "package: name='com.mobin.tigerfiles' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" /tmp/tiger-badging.txt
          grep -F "sdkVersion:'29'" /tmp/tiger-badging.txt
          APK_BYTES="$(stat -c '%s' "$APK")"
          echo "Optimized APK size: $APK_BYTES bytes"
          echo "TIGER Files release APK package, version, Android 10 minimum and signature verified."
      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: TIGER-Files-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: TIGER-Files-APK
          path: release-assets
      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          if gh release view latest --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest --repo "$REPOSITORY" --cleanup-tag --yes
          fi
          gh release create latest release-assets/app-release.apk \
            --repo "$REPOSITORY" \
            --title "TIGER Files $VERSION_NAME (Latest)" \
            --notes "Automatic build of TIGER Files.\n\nApp version: $VERSION_NAME\nPackage: com.mobin.tigerfiles\nMinimum Android: 10 (API 29)\nCommit: $GITHUB_SHA"
